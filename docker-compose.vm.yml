# Stack completo Vitalis na VM Azure (Postgres + API + ML)
# Uso: docker compose -f docker-compose.vm.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: vitalis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitalis
      POSTGRES_PASSWORD: vitalis
      POSTGRES_DB: vitalis
    volumes:
      - vitalis_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalis -d vitalis"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: vitalis-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    expose:
      - "8000"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: vitalis-api
    restart: unless-stopped
    ports:
      - "3333:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vitalis:vitalis@postgres:5432/vitalis?schema=public
      ML_SERVICE_URL: http://ml:8000
      PORT: "8080"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started

volumes:
  vitalis_pg_data:
